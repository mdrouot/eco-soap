<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBrand - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<header><h1>EcoBrand</h1><p>Natural Soap. Better Planet.</p></header>
<nav id="navigation"><ul>
    <li><a href="index.html">Home</a></li><li><a href="products.html">Shop</a></li>
    <li><a href="about.html">About Us</a></li><li><a href="cart.html">Shopping Cart</a></li><li><a href="login.html">Login</a></li>
</ul></nav>
<main class="cart-page">
    <h2>Your Shopping Cart</h2>
    <div id="cartItems" aria-live="polite"></div>
    <section id="shippingSection" class="shipping-section">
        <h3>Delivery address</h3>
        <p>We use this address to determine delivery availability and future stock planning.</p>
        <form id="shippingForm">
            <div class="form-grid">
                <label>First name<input name="firstName" autocomplete="given-name" required></label>
                <label>Last name<input name="lastName" autocomplete="family-name" required></label>
                <label class="full-width">Address line 1<input name="line1" autocomplete="address-line1" required></label>
                <label class="full-width">Address line 2 (optional)<input name="line2" autocomplete="address-line2"></label>
                <label>City<input name="city" autocomplete="address-level2" required></label>
                <label>Postcode<input name="postalCode" autocomplete="postal-code" required></label>
                <label class="full-width">Country<select name="country" autocomplete="country-name" required><option value="">Choose a country</option><option>France</option><option>Germany</option><option>Italy</option><option>Spain</option><option>United Kingdom</option><option>United States</option><option>Other</option></select></label>
            </div>
            <button type="submit">Save delivery address</button>
            <p id="shippingResult" class="result" aria-live="polite"></p>
        </form>
    </section>
    <p><a href="products.html">Continue shopping</a></p>
</main>
<footer><p>© 2026 EcoBrand</p></footer>
</body>
</html>
